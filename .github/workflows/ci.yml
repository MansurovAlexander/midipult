name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax
        run: python -m compileall -q cgi-bin service tests

      - name: Unit tests
        run: python tests/test_units.py

      - name: Static checks
        run: python tests/static_checks.py

      - name: CGI tests
        run: python tests/run_cgi_tests.py

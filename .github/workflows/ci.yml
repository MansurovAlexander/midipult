name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python syntax
        run: |
          python -m compileall -q cgi-bin service tests
          python -m py_compile index.py

      - name: Shell syntax
        run: |
          for f in deploy/*.sh; do sh -n "$f"; done
          sh -n init.d/S99mypult

      - name: Unit tests
        run: python tests/test_units.py

      - name: Static checks
        run: python tests/static_checks.py

      - name: CGI tests
        run: python tests/run_cgi_tests.py
